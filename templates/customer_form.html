{% extends "base.html" %}
{% block title %}{{ 'Edit' if customer else 'Add' }} Customer – VService Pro{% endblock %}
{% block content %}

<div class="page-header">
  <h1>{{ 'EDIT' if customer else 'ADD' }} <span>CUSTOMER</span></h1>
  <a href="/customers" class="btn btn-outline">← Back</a>
</div>

<div class="card" style="max-width:700px">
  <form method="POST">
    <div class="form-grid">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" name="name" value="{{ customer.name if customer else '' }}" required placeholder="e.g. Rajesh Kumar">
      </div>
      <div class="form-group">
        <label>Phone Number *</label>
        <input type="text" name="phone" value="{{ customer.phone if customer else '' }}" required placeholder="e.g. 9876543210">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ customer.email if customer else '' }}" placeholder="optional">
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label>Address</label>
        <textarea name="address" placeholder="Street, City, State">{{ customer.address if customer else '' }}</textarea>
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{{ 'Update Customer' if customer else 'Add Customer' }}</button>
      <a href="/customers" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
